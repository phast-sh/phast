name: release

# A `v*` tag builds every target and attaches the binaries to the GitHub Release.
# A manual run (workflow_dispatch) builds the same targets but only uploads them
# as workflow artifacts -- a dry run that publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the release and upload assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl, statically linked -> one binary runs on every distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          # macOS: built natively on the macOS runner (both arches from arm64).
          - { os: macos-latest, target: x86_64-apple-darwin,  cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }

    steps:
      - uses: actions/checkout@v7

      # Reproducible build time: key it off the commit, not wall clock.
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # Install the toolchain pinned in rust-toolchain.toml and add the target to it.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # cargo-zigbuild uses zig as the linker, cross-compiling musl (both arches)
      # from the x86_64 runner without a per-arch C toolchain.
      - name: Install zig
        if: matrix.cross
        run: pip3 install ziglang
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Linux goes through zig for a static musl binary; macOS builds natively.
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --locked --release -p phast --target ${{ matrix.target }}
          else
            cargo build --locked --release -p phast --target ${{ matrix.target }}
          fi

      # The tarball and checksum install.sh and `phast cli update` download and verify.
      - name: Package + checksum
        run: |
          name="phast-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "$name.tar.gz" phast
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      # Always available from the Actions run, so a manual run is a full dry run.
      - uses: actions/upload-artifact@v7
        with:
          name: phast-${{ matrix.target }}
          path: |
            phast-${{ matrix.target }}.tar.gz
            phast-${{ matrix.target }}.tar.gz.sha256

      # Only a tag publishes: attach the assets to the GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            phast-${{ matrix.target }}.tar.gz
            phast-${{ matrix.target }}.tar.gz.sha256

  docker:
    name: docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The two Linux tarballs `build` uploaded, so the image holds the released binaries.
      - name: Download the Linux builds
        uses: actions/download-artifact@v8
        with:
          pattern: phast-*-unknown-linux-musl
          path: artifacts

      # One binary per platform, under the name buildx gives the platform's architecture.
      - name: Unpack the Linux binaries
        run: |
          for pair in x86_64:amd64 aarch64:arm64; do
            target="${pair%%:*}-unknown-linux-musl"
            mkdir -p "dist/${pair##*:}"
            tar -xzf "artifacts/phast-$target/phast-$target.tar.gz" -C "dist/${pair##*:}"
          done

      # A BuildKit builder, which build-push-action picks up on its own. Docker's default
      # builder can't produce one image for two platforms.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      # vX.Y.Z gives X.Y.Z, X.Y and latest. The description and license are set here,
      # since the repository's own are a tagline and only half the license. GHCR reads
      # a multi-platform image's description from the index annotations, not the labels.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/phast-sh/phast
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.description=Phast, a dependency manager for PHP. Copy it into your image: COPY --from=ghcr.io/phast-sh/phast:latest /phast /bin/
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          annotations: |
            org.opencontainers.image.description=Phast, a dependency manager for PHP. Copy it into your image: COPY --from=ghcr.io/phast-sh/phast:latest /phast /bin/
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      # Only a tag pushes, so only a tag logs in.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms in one image, from the binaries in dist/.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: dist
          file: docker/phast/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
