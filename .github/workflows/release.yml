name: release

# A `v*` tag builds every target and attaches the binaries to the GitHub Release.
# A manual run (workflow_dispatch) builds the same targets but only uploads them
# as workflow artifacts -- a dry run that publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the release and upload assets

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl, statically linked -> one binary runs on every distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,  cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          # macOS: built natively on the macOS runner (both arches from arm64).
          - { os: macos-latest, target: x86_64-apple-darwin,  cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }

    steps:
      - uses: actions/checkout@v7

      # Reproducible build time: key it off the commit, not wall clock.
      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # Install the toolchain pinned in rust-toolchain.toml and add the target to it.
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # cargo-zigbuild uses zig as the linker, cross-compiling musl (both arches)
      # from the x86_64 runner without a per-arch C toolchain.
      - name: Install zig
        if: matrix.cross
        run: pip3 install ziglang
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --locked --release -p phast --target ${{ matrix.target }}
          else
            cargo build --locked --release -p phast --target ${{ matrix.target }}
          fi

      - name: Package + checksum
        run: |
          name="phast-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "$name.tar.gz" phast
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      # Always available from the Actions run, so a manual run is a full dry run.
      - uses: actions/upload-artifact@v7
        with:
          name: phast-${{ matrix.target }}
          path: |
            phast-${{ matrix.target }}.tar.gz
            phast-${{ matrix.target }}.tar.gz.sha256

      # Only a tag publishes: attach the assets to the GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            phast-${{ matrix.target }}.tar.gz
            phast-${{ matrix.target }}.tar.gz.sha256
