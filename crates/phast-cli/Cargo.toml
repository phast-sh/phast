[package]
name = "phast-cli"
version = "0.1.0"
edition = "2024"
description = "CLI commands and output formatting for Phast"
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dev-dependencies]
indoc    = { workspace = true }
wiremock = { workspace = true }
tokio    = { workspace = true }
sha2     = { workspace = true }
hex      = { workspace = true }
tar      = { workspace = true }
flate2   = { workspace = true }
tempfile = { workspace = true }

[dependencies]
phast-core      = { workspace = true }
phast-version   = { workspace = true }
phast-resolver  = { workspace = true }
phast-registry  = { workspace = true }
phast-autoload  = { workspace = true }
phast-runtime   = { workspace = true }
phast-workspace = { workspace = true }
clap            = { workspace = true }
futures         = { workspace = true }
indexmap        = { workspace = true }
anyhow          = { workspace = true }
toml            = { workspace = true }
toml_edit       = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
indicatif       = { workspace = true }
similar         = { workspace = true }
chrono          = { workspace = true, features = ["serde"] }
console         = { workspace = true }
dialoguer       = { workspace = true }
reqwest         = { workspace = true }
tar             = { workspace = true }
flate2          = { workspace = true }
sha2            = { workspace = true }
hex             = { workspace = true }
tempfile        = { workspace = true }
