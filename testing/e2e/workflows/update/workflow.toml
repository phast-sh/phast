description = "update moves a locked package to the newest version its constraint allows, and --dry-run does not."
tier        = "focused"
network     = true

# The only workflow that resolves against a live registry, because there is nothing to
# update offline: a path package's version comes from its own manifest, so no resolver
# choice exists to observe.
#
# psr/log is the subject because its 1.x branch is finished: `^1.0` has a settled answer,
# so the assertion can name the minor without pinning a patch that a release would break.
# The lock beside the spec was generated by pinning the constraint to 1.0.0 and running
# `phast lock`, then widening the manifest, which is how a project ends up behind.
#
# update prints only its timing, so the version it chose is read back with `why` rather
# than asserted on update's own output.

# Where the project starts: the constraint allows 1.x, the lock is on the oldest of them.
[[step]]
args   = ["why", "psr/log"]
stdout = ["psr/log 1.0.0 is required by:", "root (your project)", "^1.0"]

# --dry-run reports the work and stops. Nothing is installed, so vendor stays absent.
[[step]]
args   = ["update", "--dry-run"]
stdout = ["- Would install psr/log", "Dry run"]
absent = ["vendor"]

# The proof that --dry-run wrote nothing: the lock still answers with the old version. A
# snapshot cannot make this claim, since every lock carries the time it was generated.
[[step]]
args   = ["why", "psr/log"]
stdout = ["psr/log 1.0.0 is required by:"]

[[step]]
args   = ["update"]
stdout = ["(1 packages)"]

# Moved to the newest release `^1.0` admits, and no further: a package resolving to 2.x or
# 3.x here would mean update ignored the constraint rather than honored it.
[[step]]
args   = ["why", "psr/log"]
stdout = ["psr/log 1.1.", "^1.0"]

# And what it wrote is installable, which is the difference between rewriting a lock and
# rewriting a usable one.
[[step]]
args    = ["install"]
creates = ["vendor/autoload.php", "vendor/psr/log/Psr/Log/LoggerInterface.php"]
