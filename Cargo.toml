[workspace]
members = [
    "crates/phast",
    "crates/phast-cli",
    "crates/phast-core",
    "crates/phast-version",
    "crates/phast-resolver",
    "crates/phast-registry",
    "crates/phast-autoload",
    "crates/phast-runtime",
    "crates/phast-workspace",
    "testing/support",
    "testing/cli",
    "testing/e2e",
]

# Cargo's v3 resolver: MSRV-aware, and keeps dev-/build-only features
# out of the shipped binary.
resolver = "3"

# Shared package metadata.
[workspace.package]
authors    = ["Denys Horobtsov <0xbedrock@gmail.com>"]
license    = "MIT OR Apache-2.0"
repository = "https://github.com/phast-sh/phast"
publish    = false

# Shared dependency versions across all crates.
[workspace.dependencies]
# Internal crates
phast           = { path = "crates/phast" }
phast-cli       = { path = "crates/phast-cli" }
phast-core      = { path = "crates/phast-core" }
phast-version   = { path = "crates/phast-version" }
phast-resolver  = { path = "crates/phast-resolver" }
phast-registry  = { path = "crates/phast-registry" }
phast-autoload  = { path = "crates/phast-autoload" }
phast-runtime   = { path = "crates/phast-runtime" }
phast-workspace = { path = "crates/phast-workspace" }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# HTTP
reqwest = { version = "0.13.5", features = ["json", "gzip", "hickory-dns"] }
bytes   = "1.12.1"
futures = "0.3.34"

# Serialization
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml       = "1.1.8"
toml_edit  = "0.25.17"

# JSON Schema generation
schemars = { version = "1.2.3", features = ["indexmap2"] }

# Dependency resolution
pubgrub = "0.4.0"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Output
indicatif = "0.18.6"
console   = "0.16.6"
dialoguer = "0.12.0"

# Error handling
anyhow    = "1.0.104"
thiserror = "2.0.21"

# Filesystem / platform dirs
dirs    = "7.0.0"

# Concurrent data structures
dashmap  = "6.1.0"
indexmap = { version = "2.14.2", features = ["serde"] }

# Parallelism
rayon = "1.12.0"

# Hashing
sha1 = "0.11.0"
sha2 = "0.11.1"
hex  = "0.4.3"

# Date/time
chrono = { version = "0.4.45", features = ["clock"] }

# Archive extraction
zip    = "9.1.0"
tar    = "0.4.46"
flate2 = "1.1.10"

# Glob pattern matching
globset = "0.4.20"

# Diffing
similar = "3.2.1"

# Testing
tempfile = "3.27.0"
wiremock = "0.6.5"
indoc    = "2.0.8"

# Release profile tuned for distribution.
[profile.release]
opt-level     = 3      # full speed
lto           = true   # link-time optimization across the whole graph
codegen-units = 1      # maximize optimization
strip         = true   # drop symbols
